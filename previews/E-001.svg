<text x="16" y="44" font-family="Arial,Helvetica,sans-serif" font-size="4.16">1. DESIGN BASIS</text>
<text x="16" y="51.0" font-family="Arial,Helvetica,sans-serif" font-size="3.3800000000000003">Mission: 2 h sheltered-water environmental survey; visual supervision and recovery support.</text>
<text x="16" y="56.5" font-family="Arial,Helvetica,sans-serif" font-size="3.3800000000000003">Nonconductive 2-3 m hull assumed. Displacement, speed, thrust and battery mass are unresolved.</text>
<text x="16" y="62.0" font-family="Arial,Helvetica,sans-serif" font-size="3.3800000000000003">B1: 8S LiFePO4 / 25.6 V nominal / 100 Ah / planning range 22.4-29.2 V.</text>
<text x="16" y="67.5" font-family="Arial,Helvetica,sans-serif" font-size="3.3800000000000003">No charger aboard. Remove/isolate pack for approved shore charging. No AC system in scope.</text>
<text x="16" y="81" font-family="Arial,Helvetica,sans-serif" font-size="4.16">2. FUNCTIONAL SINGLE-LINE (RETURNS OMITTED ON THIS SHEET)</text>
