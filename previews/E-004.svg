<text x="143" y="120" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">NO contact only while heartbeat valid.</text>
<text x="143" y="124" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">&gt;1 s timeout -&gt; neutral, then open K1.</text>
<text x="143" y="128" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">HW/SW implementation not provided.</text>
<text x="143" y="132" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">Failure-high behaviour unresolved.</text>
