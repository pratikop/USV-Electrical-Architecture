<text x="49" y="180.57999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Pre-energization review</text>
<text x="131" y="180.57999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Datasheets, fault current, polarity, torque, return continuity and BMS limits approved.</text>
<text x="18" y="190.07999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">T04</text>
<text x="49" y="190.07999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Current-limited supply</text>
<text x="131" y="190.07999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">12 V panel remains 11.4-12.6 V at 60 W; no reset over intended input range.</text>
<text x="18" y="199.57999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">T05</text>
<text x="49" y="199.57999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Guarded load emulation</text>
<text x="131" y="199.57999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Cable-only propulsion path drop &lt;=3%; ESC input above UV limit; thermal limits met.</text>
<text x="18" y="209.07999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">T06-07</text>
<text x="49" y="209.07999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Stop / heartbeat loss</text>
<text x="131" y="209.07999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Proposed K1 power removal &lt;=0.5 s on local stop; &gt;1 s timeout response; manual re-arm.</text>
<text x="18" y="218.57999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">T08-09</text>
<text x="49" y="218.57999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Ingress / wet motor setup</text>
<text x="131" y="218.57999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Approved facility/procedure; record transients; fault/feedback response reviewed.</text>
<text x="18" y="228.07999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">T10</text>
<text x="49" y="228.07999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">Supervised water trial</text>
<text x="131" y="228.07999999999998" font-family="Arial,Helvetica,sans-serif" font-size="2.9250000000000003">2 h within pack/SOC/thermal limits; log V/I/Wh and conditions; recovery support.</text>
<text x="16" y="240.0" font-family="Arial,Helvetica,sans-serif" font-size="3.12">No deliberate pack short circuit. No dry-running water-cooled thrusters. Power removal does not prove stopped thrust or vessel motion.</text>
