<text x="16" y="196" font-family="Arial,Helvetica,sans-serif" font-size="3.9000000000000004">GENERAL DRAWING / DESIGN NOTES</text>
<text x="16" y="203.0" font-family="Arial,Helvetica,sans-serif" font-size="3.055">1. NTS schematic sheets. Model-space coordinates are paper mm. Open DXF in AutoCAD; plot A3 landscape 1:1.</text>
<text x="16" y="208.25" font-family="Arial,Helvetica,sans-serif" font-size="3.055">2. Simplified conventional symbols only. Tags/terminal allocations are illustrative, not vendor connection instructions.</text>
<text x="16" y="213.5" font-family="Arial,Helvetica,sans-serif" font-size="3.055">3. All ampacities are assumptions. Validate installation derating, connector ratings and fuse curves before design release.</text>
<text x="16" y="218.75" font-family="Arial,Helvetica,sans-serif" font-size="3.055">4. Single battery, BMS and converter remain common failure points. No redundancy or standards compliance is claimed.</text>
<text x="16" y="224.0" font-family="Arial,Helvetica,sans-serif" font-size="3.055">5. Rev D: author identification and auxiliary-load terminology clarified. Electrical sizing is unchanged.</text>
<text x="16" y="229.25" font-family="Arial,Helvetica,sans-serif" font-size="3.055">6. Sources: Victron Wiring Unlimited, DC wiring; Blue Sea Systems Circuit Protection. Full links in docs/engineering_brief.md.</text>
<text x="16" y="234.5" font-family="Arial,Helvetica,sans-serif" font-size="3.055">7. No drawings created in AutoCAD, hardware measurements, dynamic simulation or employer involvement are claimed.</text>
</svg>