<text x="273" y="120" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">Main contact on E-002; hotel stays live.</text>
<text x="273" y="124" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">Auxiliary feedback needed for fault detection.</text>
