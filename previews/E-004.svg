<text x="18" y="115" font-family="Arial,Helvetica,sans-serif" font-size="3.9000000000000004">-SR1 / MANUAL PERMIT</text>
<text x="18" y="120" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">Functional module; not selected.</text>
<text x="18" y="124" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">Requires deliberate reset/arm action.</text>
<text x="18" y="128" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">No auto re-arm after power/stop reset.</text>
<text x="18" y="132" font-family="Arial,Helvetica,sans-serif" font-size="2.9899999999999998">Reset and feedback terminals TBD.</text>
